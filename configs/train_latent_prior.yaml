data:
  latent_dir: cache/sqg256/train
  latent_valid_dir: cache/sqg256/valid
model:
  latent_channels: 32
  backbone: vit
  spatial: 2
  hid_channels: 512
  hid_blocks: 12
  attention_heads: 8
  ffn_factor: 4
  qk_norm: true
  rope: true
  patch_size: 1
  window_size: null
  dropout: 0.05
  checkpointing: false
  time_embed_dim: 128
rectified_flow:
  time_sampling_mean: 0.0
  time_sampling_std: 1.0
training:
  batch_size: 1024
  steps: 81920
  lr: 0.0001
  grad_clip: 1.0
  precision: bf16
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  save_every: 5000
ema:
  decay: 0.99
  update_after_step: 1000
  update_every: 1
optim:
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.0
  warmup_steps: 1000
  warmup_start_factor: 0.1
  min_lr: 1.0e-6
output:
  save_dir: runs/latent_prior
device: cuda
